# render.yaml - LUMINA Backend Deployment Configuration
# Render.com free tier for the FastAPI backend.
#
# DURABILITY (CP-10):
#   Render free-tier web services have an EPHEMERAL filesystem — they CANNOT
#   attach a persistent disk (only paid services can). A local SQLite file on a
#   free Render web service is therefore lost on every restart/redeploy.
#
#   The DURABLE production path is a Supabase (PostgreSQL) free-tier database:
#     - Set LUMINA_DB_BACKEND=postgres
#     - Provide the connection string via DATABASE_URL as a Render "secret"
#       (Sync "secret" and set it in the dashboard; do NOT hardcode it here).
#   PostgreSQL persists across web-service restarts/redeploys.
#
#   Supabase free-tier caveat (documented, not hidden): free projects are
#   auto-paused after ~7 days of no database activity and must be manually
#   resumed in the Supabase dashboard. This is a deployment-level availability
#   limitation, not a per-request persistence gap.
#
#   To migrate an existing local SQLite database into Supabase, run:
#     python -m app.persistence.migrate <local.db> <DATABASE_URL>
#   (idempotent and restart-safe).
#
#   LUMINA_DB_PATH is ignored when the backend is postgres; the SQLite backend
#   remains the local-development default and is not used in this deployment.

services:
  - type: web
    name: lumina-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: LUMINA_CORS_ORIGINS
        sync: false
      - key: LUMINA_ENCRYPTION_KEY
        sync: false
      - key: LUMINA_DB_BACKEND
        value: "postgres"
      # DATABASE_URL must be provided as a secret on the production service.
      # Example (Supabase): postgresql://postgres.<project>@aws-0-<region>.pooler.supabase.com:6543/postgres
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /health
    autoDeploy: false
