plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.lumina.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.lumina.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Keep only what the Phase-2 foundation actually uses. Invasive/unused
    // libraries (location, usage/work) were removed along with their signals.
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Device-independent unit tests for the pure-logic foundation
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
